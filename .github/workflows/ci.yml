name: CI

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Display Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test --parallel

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .arc-tools
          key: arc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.arc-tool-versions', 'ARCDevTools/configs/tool-versions') }}

      - name: Install pinned SwiftLint
        run: ./ARCDevTools/scripts/install-tools.sh swiftlint

      - name: Run SwiftLint
        run: .arc-tools/bin/swiftlint lint --config .swiftlint.yml --strict

  swiftformat:
    name: SwiftFormat
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .arc-tools
          key: arc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.arc-tool-versions', 'ARCDevTools/configs/tool-versions') }}

      - name: Install pinned SwiftFormat
        run: ./ARCDevTools/scripts/install-tools.sh swiftformat

      - name: Check formatting
        run: .arc-tools/bin/swiftformat --config .swiftformat --lint Sources/ Tests/
